# Turns on the engine's local graph backup (POST /debug/graph-backup, called by engram-graph-backup.timer).
# The folder is outside the repo and outside data/. GRAPH_BACKUP_COPY_TO (a second folder, such as a mounted drive)
# is deliberately not set; set it here to add a second copy of every backup.
[Service]
Environment=GRAPH_BACKUP_DIR=/home/halo/backups/engram-graph
#Environment=GRAPH_BACKUP_COPY_TO=/mnt/backup-drive/engram-graph
